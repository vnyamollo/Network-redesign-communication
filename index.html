<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>WRTA Network Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: top bar with the network switch; route panel on the left (bottom on phones); map fills the rest. */
:root {
  --bg: #f4f5f3;          /* page and map fallback */
  --panel: #ffffff;
  --ink: #1d2422;
  --muted: #5f6a66;
  --line: #dde1de;
  --accent: #0f6e63;      /* switch and focus */
  --accent-ink: #ffffff;
  --hover: #eef2f0;
  --map-bg: #e9ebe7;
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-label: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141917; --panel: #1b2220; --ink: #e6ebe8; --muted: #9aa6a1; --line: #2c3532;
    --accent: #4fc2b2; --accent-ink: #0b1513; --hover: #232c29; --map-bg: #1f2523; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141917; --panel: #1b2220; --ink: #e6ebe8; --muted: #9aa6a1; --line: #2c3532;
  --accent: #4fc2b2; --accent-ink: #0b1513; --hover: #232c29; --map-bg: #1f2523; color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }

/* Top bar */
.top {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-label); font-weight: 700; font-size: 20px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 12px; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.switch button {
  font: 600 13px/1 var(--font-ui); color: var(--muted); background: none; border: 0; cursor: pointer;
  padding: 9px 16px; border-radius: 999px;
}
.switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.switch button:focus-visible, .route:focus-visible, .back:focus-visible, .zoom button:focus-visible,
#search:focus-visible, .badge-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Body: panel + map */
.main { flex: 1; display: flex; min-height: 0; }
.panel { width: 340px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
.panel-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.scenario { font-size: 12px; color: var(--muted); }
.scenario b { color: var(--ink); font-weight: 600; }
#search {
  width: 100%; box-sizing: border-box; font: 400 14px var(--font-ui); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
}
.list { overflow-y: auto; flex: 1; min-height: 0; }
.route {
  display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 10px; width: 100%;
  text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
  padding: 10px 16px; cursor: pointer; color: var(--ink); font: inherit;
}
.route:hover, .route.hot { background: var(--hover); }
.route .name { min-width: 0; }
.route .name div:first-child { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.route .name div:last-child { color: var(--muted); font-size: 12px; margin-top: 2px; }
.badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 26px; padding: 0 6px;
  border-radius: 5px; font: 700 15px/1 var(--font-label); letter-spacing: .02em; box-sizing: border-box;
  font-variant-numeric: tabular-nums;
}
.empty { padding: 16px; color: var(--muted); }

/* Route detail */
.detail { overflow-y: auto; flex: 1; min-height: 0; padding: 14px 16px 20px; display: grid; gap: 16px; align-content: start; }
.back { justify-self: start; background: none; border: 0; color: var(--accent); font: 600 13px var(--font-ui); cursor: pointer; padding: 4px 0; }
.dhead { display: flex; gap: 12px; align-items: center; }
.dhead .badge { height: 34px; min-width: 52px; font-size: 20px; }
.dhead h2 { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.fact { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.fact div:first-child { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fact div:last-child { font: 600 20px var(--font-label); margin-top: 2px; font-variant-numeric: tabular-nums; }
.detail h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td:last-child { text-align: right; font-weight: 500; }
td small { display: block; color: var(--muted); font-size: 12px; }
.note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }

/* Map */
.mapwrap { flex: 1; position: relative; min-width: 0; background: var(--map-bg); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#map.dragging { cursor: grabbing; }
#map.pointer { cursor: pointer; }
.zoom { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 30px; display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.zoom button { width: 36px; height: 36px; border: 0; background: none; color: var(--ink); font: 600 18px var(--font-ui); cursor: pointer; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--hover); }
.attrib { position: absolute; right: 0; bottom: 0; font-size: 11px; padding: 2px 6px; background: color-mix(in srgb, var(--panel) 80%, transparent); color: var(--muted); }
.attrib a { color: inherit; }
.tiles-off { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.layers { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; width: 230px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgb(0 0 0 / .12); overflow: hidden; }
.layers-toggle { width: 100%; text-align: left; background: none; border: 0; color: var(--ink); font: 600 13px var(--font-ui);
  padding: 10px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.layers-toggle::after { content: "▾"; color: var(--muted); }
.layers-toggle[aria-expanded="false"]::after { content: "▸"; }
.layers-toggle:focus-visible, .layer input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.layer-list { border-top: 1px solid var(--line); padding: 4px 0; max-height: 50vh; overflow-y: auto; }
.layer { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer; }
.layer:hover { background: var(--hover); }
.layer input { margin: 0; accent-color: var(--accent); }
.layer .dot { width: 18px; height: 18px; border-radius: 50%; color: #fff; font: 700 10px/18px var(--font-ui); text-align: center; }
.layer .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.layers-empty { padding: 8px 12px; color: var(--muted); font-size: 12px; }
.tip {
  position: absolute; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 8px rgb(0 0 0 / .15);
  transform: translate(10px, -50%);
}
.popup {
  position: absolute; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; width: 220px; box-shadow: 0 4px 16px rgb(0 0 0 / .18); transform: translate(-50%, calc(-100% - 12px));
}
.popup .t { font-weight: 600; margin-bottom: 2px; padding-right: 18px; }
.popup .s { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.popup .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.popup .x { position: absolute; top: 4px; right: 6px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
.badge-btn { border: 0; cursor: pointer; padding: 0; background: none; }

@media (max-width: 760px) {
  .main { flex-direction: column-reverse; }
  .panel { width: auto; height: 44%; border-right: 0; border-top: 1px solid var(--line); }
  .mapwrap { min-height: 0; }
  .brand span { display: none; }
  .layers { width: 190px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand">
      <h1>WRTA Network Map</h1>
      <span>Bus routes in the study area</span>
    </div>
    <div class="switch" role="group" aria-label="Network">
      <button type="button" id="btn-current" aria-pressed="false">Current network</button>
      <button type="button" id="btn-proposed" aria-pressed="true">Proposed network</button>
    </div>
  </header>
  <div class="main">
    <aside class="panel" aria-label="Routes">
      <div id="list-view" style="display:contents">
        <div class="panel-head">
          <div class="scenario">Showing: <b id="scenario-name">Proposed network</b> · <span id="route-count"></span></div>
          <input id="search" type="search" placeholder="Find a route by number or name" autocomplete="off" aria-label="Find a route">

        <div class="list" id="list"></div>
      </div>
      <div class="detail" id="detail" hidden></div>
    </aside>
    <div class="mapwrap" id="mapwrap">
      <canvas id="map" aria-label="Map of bus routes"></canvas>
      <div class="zoom">
        <button type="button" id="zin" aria-label="Zoom in">+</button>
        <button type="button" id="zout" aria-label="Zoom out">−</button>
      </div>
      <div class="tip" id="tip" hidden></div>
      <div class="popup" id="popup" hidden></div>
      <div class="layers" id="layers">
        <button type="button" class="layers-toggle" id="layers-toggle" aria-expanded="true" aria-controls="layer-list">Data layers</button>
        <div class="layer-list" id="layer-list"></div>
      </div>
      <div class="tiles-off" id="tiles-off" hidden>Street map could not load. Routes and stops are still shown.</div>
      <div class="attrib" id="attrib"></div>
    </div>
  </div>
</div>

// ── Projection (Web Mercator, normalised 0–1 world coordinates) ──
const TILE = 256;
function project(lat, lon) {
  const s = Math.sin(lat * Math.PI / 180);
  return [(lon + 180) / 360, 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)];
}
for (const key of ["current", "proposed"]) {
  for (const r of DATA[key].routes) r.xy = r.shapes.map(line => line.map(([a, b]) => project(a, b)));
  for (const s of DATA[key].stops) s.xy = project(s.lat, s.lon);
}

const view = { cx: 0, cy: 0, z: 12 };
const MINZ = 9, MAXZ = 19;

let hover = null;          // route id under the pointer
let popupStop = null;

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const wrap = document.getElementById("mapwrap");
let W = 0, H = 0, DPR = 1;

function resize() {

function scale() { return TILE * Math.pow(2, view.z); }

function toWorld(x, y) { const k = scale(); return [view.cx + (x - W / 2) / k, view.cy + (y - H / 2) / k]; }

function fitAll() {
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const key of ["current", "proposed"]) for (const r of DATA[key].routes) for (const l of r.xy) for (const [x, y] of l) {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;

    ctx.fillText(letter, x, y + 0.5);
  }
  if (view.z >= 15.5) {        // names next to the markers when zoomed in
    ctx.font = '500 11px "Public Sans", system-ui, sans-serif'; ctx.textAlign = "left";
    ctx.lineJoin = "round"; ctx.lineWidth = 3; ctx.strokeStyle = css("--panel"); ctx.fillStyle = css("--ink");
    for (const p of pts) {
      const [x, y] = toScreen(p.xy);
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      ctx.strokeText(p.name, x + r + 4, y); ctx.fillText(p.name, x + r + 4, y);
    }
  }
}
function hitPoi(x, y) {
  let best = null, bd = 11;
  for (const p of visiblePoi()) { const [px, py] = toScreen(p.xy), d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = p; } }
  return best;
}
function renderLayers() {
  const box = document.getElementById("layer-list");
  const entries = Object.entries(DATA.poi || {});
  box.innerHTML = entries.length ? entries.map(([key, layer]) => {
    const [color, letter] = POI_STYLE[key] || ["#555", "•"];
    return `<label class="layer"><input type="checkbox" id="layer-${key}" data-layer="${key}" ${poiOn.has(key) ? "checked" : ""}>
      <span class="dot" style="background:${color}">${letter}</span><span>${esc(layer.label)}</span><span class="count">${layer.points.length}</span></label>`;
  }).join("") : `<div class="layers-empty">No data layers in this map.</div>`;
}

// ── Drawing ──
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function lineWidth() { return view.z < 11.5 ? 2 : view.z < 13.5 ? 3 : view.z < 15.5 ? 4 : 5; }
function strokeRoute(r, w, alpha, casing) {
  ctx.globalAlpha = alpha;
  for (const l of r.xy) {
    ctx.beginPath();
    l.forEach((p, i) => { const [x, y] = toScreen(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    if (casing) { ctx.strokeStyle = css("--panel"); ctx.lineWidth = w + 3; ctx.stroke(); }
    ctx.strokeStyle = r.color; ctx.lineWidth = w; ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function visibleStops() {
  const d = DATA[net];
  if (selected) {
    const r = d.routes.find(r => r.id === selected);
    return view.z >= 12 && r ? r.stops.map(i => d.stops[i]) : [];
  }
  return view.z >= 14 ? d.stops : [];
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = css("--map-bg"); ctx.fillRect(0, 0, W, H);
  drawTiles();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const d = DATA[net], w = lineWidth();
  for (const r of d.routes) if (r.id !== selected && r.id !== hover) strokeRoute(r, w, selected ? 0.18 : 0.9, false);
  const hv = d.routes.find(r => r.id === hover && r.id !== selected);
  if (hv) strokeRoute(hv, w + 2, 1, true);
  const sel = d.routes.find(r => r.id === selected);
  if (sel) strokeRoute(sel, w + 2, 1, true);
  drawPoi();
  const stops = visibleStops(), rad = view.z >= 15 ? 4.5 : 3.5;
  ctx.lineWidth = 1.5; ctx.strokeStyle = css("--ink"); ctx.fillStyle = css("--panel");
  for (const s of stops) {
    const [x, y] = toScreen(s.xy);
    if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
  }
  if (popupStop) placePopup();
}
let pending = false;
function scheduleDraw() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; draw(); }); } }

// ── Hit testing ──
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
  let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * dx, py - ay - t * dy);
}
function hitStop(x, y) {
  let best = null, bd = 9;
  for (const s of visibleStops()) { const [sx, sy] = toScreen(s.xy), dd = Math.hypot(sx - x, sy - y); if (dd < bd) { bd = dd; best = s; } }
  return best;
}
function hitRoute(x, y) {
  let best = null, bd = 7;
  const routes = DATA[net].routes;
  const order = selected ? [routes.find(r => r.id === selected), ...routes.filter(r => r.id !== selected)].filter(Boolean) : routes;
  for (const r of order) {
    for (const l of r.xy) for (let i = 1; i < l.length; i++) {
      const [ax, ay] = toScreen(l[i - 1]), [bx, by] = toScreen(l[i]);
      const dd = segDist(x, y, ax, ay, bx, by);
      if (dd < bd) { bd = dd; best = r; }
    }
    if (selected && best && best.id === selected) return best;   // the highlighted route wins ties
  }
  return best;
}

// ── Text helpers ──
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function badge(r) { return `<span class="badge" style="background:${r.color};color:${r.text}">${esc(r.short)}</span>`; }
function every(p) {
  if (!p || p.n === 0) return "No service";
  if (p.n < 3) return `${p.n} trip${p.n > 1 ? "s" : ""}`;
  return `Every ${Math.round(p.mins / p.n)} min`;
}
function everyAllDay(p) {
  if (!p || p.n === 0) return "No service";
  if (p.n < 3) return `${p.n} trip${p.n > 1 ? "s" : ""}`;
  return `Every ${Math.round(p.mins / (p.n - 1))} min`;
}
function summary(r) {
  const wk = r.service.weekday;
  return wk ? `Weekday midday: ${every(wk.midday).replace("Every", "every")}` : "No weekday service";
}

// ── Panel ──
const listEl = document.getElementById("list"), detailEl = document.getElementById("detail"), listView = document.getElementById("list-view");
function renderList() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const routes = DATA[net].routes.filter(r => !q || r.short.toLowerCase().includes(q) || r.long.toLowerCase().includes(q));
  document.getElementById("scenario-name").textContent = net === "current" ? "Current network" : "Proposed network";
  document.getElementById("route-count").textContent = `${DATA[net].routes.length} routes`;
  listEl.innerHTML = routes.length ? routes.map(r =>
    `<button type="button" class="route" data-id="${esc(r.id)}">${badge(r)}<span class="name"><div>${esc(r.long)}</div><div>${esc(summary(r))}</div></span></button>`
  ).join("") : `<div class="empty">No routes match “${esc(q)}”.</div>`;
}
function renderDetail() {
  const r = DATA[net].routes.find(r => r.id === selected);
  if (!r) { selected = null; detailEl.hidden = true; listView.style.display = "contents"; renderList(); return; }
  const s = r.service, wk = s.weekday;
  const rows = [];
  if (wk) {
    rows.push(["Weekday early morning", "6–9 AM", every(wk.am)], ["Weekday midday", "9 AM–3 PM", every(wk.midday)],
              ["Weekday afternoon", "3–6 PM", every(wk.pm)], ["Weekday evening", "6–10 PM", every(wk.evening)]);
  } else rows.push(["Weekday", "", "No service"]);
  rows.push(["Saturday", "", everyAllDay(s.saturday && s.saturday.allday)], ["Sunday", "", everyAllDay(s.sunday && s.sunday.allday)]);
  const span = d => s[d] ? `${s[d].span[0]} – ${s[d].span[1]}` : "No service";
  detailEl.innerHTML = `
    <button type="button" class="back" id="back">← All routes</button>
    <div class="dhead">${badge(r)}<h2>${esc(r.long)}</h2></div>
    <div class="facts">
      <div class="fact"><div>Route length</div><div>${r.lengthMi.toFixed(1)} mi</div></div>
      <div class="fact"><div>Stops</div><div>${r.nStops}</div></div>
    </div>
    <div><h3>How often buses come</h3><table>${rows.map(([a, b, c]) => `<tr><td>${a}${b ? `<small>${b}</small>` : ""}</td><td>${c}</td></tr>`).join("")}</table></div>
    <div><h3>Hours of service</h3><table>
      <tr><td>Weekday</td><td>${span("weekday")}</td></tr>
      <tr><td>Saturday</td><td>${span("saturday")}</td></tr>
      <tr><td>Sunday</td><td>${span("sunday")}</td></tr></table></div>
    <p class="note">Frequencies are averages for each time period in the busier direction. Route length is the average of the two directions.</p>`;
  listView.style.display = "none"; detailEl.hidden = false;
  document.getElementById("back").onclick = () => select(null);
}
function select(id, zoomTo) {
  selected = id; popupStop = null; document.getElementById("popup").hidden = true;
  if (id) { renderDetail(); if (zoomTo) fitRoute(id); } else { detailEl.hidden = true; listView.style.display = "contents"; renderList(); }
  draw();
}
function fitRoute(id) {
  const r = DATA[net].routes.find(r => r.id === id); if (!r) return;
  let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
  for (const l of r.xy) for (const [x, y] of l) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
  view.z = Math.max(MINZ, Math.min(16, Math.log2((W - 80) / ((x1 - x0) * TILE + 1e-9)), Math.log2((H - 80) / ((y1 - y0) * TILE + 1e-9))));
}
listEl.addEventListener("click", e => { const b = e.target.closest(".route"); if (b) select(b.dataset.id, true); });
listEl.addEventListener("mouseover", e => { const b = e.target.closest(".route"); hover = b ? b.dataset.id : null; draw(); });
listEl.addEventListener("mouseleave", () => { hover = null; draw(); });
document.getElementById("search").addEventListener("input", renderList);

// ── Network switch ──
function setNet(n) {
  net = n;
  document.getElementById("btn-current").setAttribute("aria-pressed", n === "current");
  document.getElementById("btn-proposed").setAttribute("aria-pressed", n === "proposed");
  history.replaceState(null, "", "#" + n);
  if (selected && !DATA[net].routes.some(r => r.id === selected)) selected = null;
  hover = null; popupStop = null; document.getElementById("popup").hidden = true;
  selected ? renderDetail() : renderList();
  draw();
}
document.getElementById("btn-current").onclick = () => setNet("current");
document.getElementById("btn-proposed").onclick = () => setNet("proposed");

// ── Stop popup ──
const popup = document.getElementById("popup");
function openStop(s) {
  popupStop = s;
  const routes = DATA[net].routes.filter(r => s.routes.includes(r.short));
  popup.innerHTML = `<button type="button" class="x" aria-label="Close">×</button><div class="t">${esc(s.name)}</div>
    <div class="s">Stop served by ${routes.length} route${routes.length === 1 ? "" : "s"}</div>
    <div class="badges">${routes.map(r => `<button type="button" class="badge-btn" data-id="${esc(r.id)}" aria-label="Route ${esc(r.short)}">${badge(r)}</button>`).join("")}</div>`;
  popup.hidden = false; placePopup();
  popup.querySelector(".x").onclick = () => { popupStop = null; popup.hidden = true; };
  popup.querySelectorAll(".badge-btn").forEach(b => b.onclick = () => select(b.dataset.id, false));
}
function openPoi(q) {
  popupStop = q;
  popup.innerHTML = `<button type="button" class="x" aria-label="Close">×</button><div class="t">${esc(q.name)}</div><div class="s" style="margin:0">${esc(q.label)}</div>`;
  popup.hidden = false; placePopup();
  popup.querySelector(".x").onclick = () => { popupStop = null; popup.hidden = true; };
}
function placePopup() {
  const [x, y] = toScreen(popupStop.xy);
  popup.style.left = Math.max(120, Math.min(W - 120, x)) + "px"; popup.style.top = y + "px";
}

// ── Pointer interaction: drag, wheel, pinch, click, hover ──
const tip = document.getElementById("tip");
const pointers = new Map();
let drag = null, pinch = null, moved = 0;
function zoomAt(x, y, dz) {
  const [wx, wy] = toWorld(x, y);
  view.z = Math.max(MINZ, Math.min(MAXZ, view.z + dz));
  const k = scale(); view.cx = wx - (x - W / 2) / k; view.cy = wy - (y - H / 2) / k;
  scheduleDraw();
}
function local(e) { const b = canvas.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, local(e)); moved = 0; tip.hidden = true;
  if (pointers.size === 1) { drag = { p: local(e), cx: view.cx, cy: view.cy }; }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: view.z }; drag = null;
  }
});
canvas.addEventListener("pointermove", e => {
  const p = local(e);
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    zoomAt(mx, my, pinch.z + Math.log2(d / pinch.d) - view.z); moved += 10; return;
  }
  if (drag) {
    const dx = p[0] - drag.p[0], dy = p[1] - drag.p[1]; moved = Math.max(moved, Math.hypot(dx, dy));
    if (moved > 3) { canvas.classList.add("dragging"); tip.hidden = true;
      const k = scale(); view.cx = drag.cx - dx / k; view.cy = drag.cy - dy / k; scheduleDraw(); }
    return;
  }
  if (e.pointerType !== "mouse") return;
  const s = hitStop(...p), q = s ? null : hitPoi(...p), r = s || q ? null : hitRoute(...p);
  canvas.classList.toggle("pointer", !!(s || q || r));
  if (s) { tip.textContent = s.name; }
  else if (q) { tip.textContent = `${q.name} · ${q.label}`; }
  else if (r) { tip.textContent = `Route ${r.short} · ${r.long}`; }
  tip.hidden = !(s || q || r);
  if (s || q || r) { tip.style.left = p[0] + "px"; tip.style.top = p[1] + "px"; }
  const h = r ? r.id : null;
  if (h !== hover) { hover = h; scheduleDraw(); }
});
function endPointer(e) {
  const p = local(e);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && moved <= 3 && pointers.size === 0) {
    const s = hitStop(...p);
    const q = s ? null : hitPoi(...p);
    if (s) openStop(s);
    else if (q) openPoi(q);
    else { const r = hitRoute(...p); if (r) select(r.id, false); else { popupStop = null; popup.hidden = true; } }
  }
  if (pointers.size === 0) { drag = null; canvas.classList.remove("dragging"); }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !drag) { tip.hidden = true; if (hover) { hover = null; scheduleDraw(); } } });
canvas.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = local(e); zoomAt(x, y, -e.deltaY * (e.deltaMode ? 0.05 : 0.002)); }, { passive: false });
canvas.addEventListener("dblclick", e => { const [x, y] = local(e); zoomAt(x, y, 1); });
document.getElementById("zin").onclick = () => zoomAt(W / 2, H / 2, 1);
document.getElementById("zout").onclick = () => zoomAt(W / 2, H / 2, -1);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (popupStop) { popupStop = null; popup.hidden = true; } else if (selected) select(null); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", scheduleDraw);
new MutationObserver(scheduleDraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
new ResizeObserver(resize).observe(wrap);

// ── Data layers panel ──
document.getElementById("layer-list").addEventListener("change", e => {
  const key = e.target.dataset.layer; if (!key) return;
  e.target.checked ? poiOn.add(key) : poiOn.delete(key);
  if (popupStop && popupStop.layer && !poiOn.has(popupStop.layer)) { popupStop = null; popup.hidden = true; }
  draw();
});
document.getElementById("layers-toggle").onclick = e => {
  const open = e.currentTarget.getAttribute("aria-expanded") !== "true";
  e.currentTarget.setAttribute("aria-expanded", open);
  document.getElementById("layer-list").hidden = !open;
};
if (matchMedia("(max-width: 760px)").matches) document.getElementById("layers-toggle").click();   // start closed on phones
document.getElementById("attrib").innerHTML = '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  + (USE_CARTO ? ' © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>' : "");
renderLayers();

// ── Start ──
W = wrap.clientWidth; H = wrap.clientHeight;
fitAll();
setNet(net);
resize();
</script>

</body>
</html>
